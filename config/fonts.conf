<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Global macOS font mappings -->
  
  <!-- Alias -apple-system, BlinkMacSystemFont, system-ui, SF Pro, San Francisco to SF Pro Text -->
  <match target="pattern">
    <test name="family">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SF Pro</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>San Francisco</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>SF Pro Text</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SF Compact</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>SF Compact Text</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>New York</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>New York Medium</string>
    </edit>
  </match>

  <!-- Default sans-serif preference -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
      <family>SF Compact Text</family>
      <family>SF Pro Rounded</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- Default serif preference -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>New York Medium</family>
      <family>New York Large</family>
      <family>New York Small</family>
      <family>Noto Serif</family>
    </prefer>
  </alias>

  <!-- Default monospace preference -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>SF Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- Default system-ui preference -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>SF Pro Text</family>
      <family>SF Pro Display</family>
    </prefer>
  </alias>

</fontconfig>
