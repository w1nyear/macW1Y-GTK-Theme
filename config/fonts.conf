<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- macW1Y build font mappings -->
<fontconfig>
  <!-- System font mappings using default typography -->
  
  <match target="pattern">
    <test name="family">
      <string>default</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Default</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Default</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Default</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Default Display</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default Display</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Inter</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Default</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Default Text</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Default Display</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default Display</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Default Rounded</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default Rounded</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Default Rounded</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default Rounded</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>Default Mono</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Default Mono</string>
    </edit>
  </match>

  <!-- Default sans-serif preference -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Default</family>
      <family>Default Display</family>
      <family>Default Rounded</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- Default monospace preference -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Default Mono</family>
      <family>Ubuntu Sans Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- Default system-ui preference -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Default</family>
      <family>Default Display</family>
    </prefer>
  </alias>

</fontconfig>
