<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Global macOS font mappings using FOSS Inter & Open Runde -->
  
  <!-- Alias -apple-system, BlinkMacSystemFont, system-ui, SF Pro, San Francisco to Inter -->
  <match target="pattern">
    <test name="family">
      <string>-apple-system</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>BlinkMacSystemFont</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>system-ui</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SF Pro</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>San Francisco</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SF Pro Text</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SF Pro Display</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter Display</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SF Compact</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SF Compact Text</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SF Compact Display</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Inter Display</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SF Pro Rounded</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Open Runde</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SF Compact Rounded</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Open Runde</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>SF Mono</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Ubuntu Sans Mono</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family">
      <string>New York</string>
    </test>
    <edit name="family" mode="assign" binding="strong">
      <string>Noto Serif</string>
    </edit>
  </match>

  <!-- Default sans-serif preference -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>Inter Display</family>
      <family>Open Runde</family>
      <family>Noto Sans</family>
    </prefer>
  </alias>

  <!-- Default serif preference -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>

  <!-- Default monospace preference -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Ubuntu Sans Mono</family>
      <family>DejaVu Sans Mono</family>
      <family>Noto Sans Mono</family>
    </prefer>
  </alias>

  <!-- Default system-ui preference -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Inter</family>
      <family>Inter Display</family>
    </prefer>
  </alias>

</fontconfig>
