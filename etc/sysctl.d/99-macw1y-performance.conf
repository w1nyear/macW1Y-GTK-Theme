# macW1Y Gaming, Low-Latency & Multitasking Hang-Isolation Tuning
# Boost max memory map count for Steam Proton, Wine, CS2, and modern games
vm.max_map_count = 16777216

# Increase maximum file descriptors
fs.file-max = 2097152

# Multitasking memory isolation: keep caches and prioritize zram compression over file cache eviction
vm.swappiness = 100

# Keep directory and inode caches in RAM
vm.vfs_cache_pressure = 50

# Smooth out background writeouts
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Early background reclaim to prevent direct reclaim stalls and frame drops
vm.watermark_scale_factor = 125

# Prevent kswapd memory compaction pauses and stutter during heavy memory allocation
vm.watermark_boost_factor = 0
vm.compaction_proactiveness = 0

# Prevent process starvation and memory lock hogging by rogue/heavy processes
vm.page_lock_unfairness = 1

# Automatic task grouping per session to isolate CPU-heavy background tasks
kernel.sched_autogroup_enabled = 1

# Boost inotify watches for smooth multitasking with IDEs and file trackers
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024

# Network buffer and low-latency queuing discipline for multiplayer gaming
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
