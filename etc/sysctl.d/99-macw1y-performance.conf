# macW1Y Gaming & Low-Latency Performance Tuning
# Boost max memory map count for Steam Proton, Wine, CS2, and modern games
vm.max_map_count = 16777216

# Increase maximum file descriptors
fs.file-max = 2097152

# Reduce swapping aggressiveness (keep apps in RAM for instant launch)
vm.swappiness = 10

# Keep directory and inode caches in RAM
vm.vfs_cache_pressure = 50

# Smooth out background writeouts
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# Network buffer and low-latency queuing discipline for multiplayer gaming
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
