# Limit CPU frequency, disable Turbo Boost, and apply Windows DTT RAPL power limits
w /sys/devices/system/cpu/intel_pstate/no_turbo - - - - 1
w /sys/devices/system/cpu/cpu*/cpufreq/scaling_max_freq - - - - 2400000
w /sys/devices/system/cpu/cpu*/cpufreq/energy_performance_preference - - - - balance_performance
w /sys/class/powercap/intel-rapl/intel-rapl:0/constraint_0_power_limit_uw - - - - 45000000
w /sys/class/powercap/intel-rapl/intel-rapl:0/constraint_1_power_limit_uw - - - - 55000000
