<svg width="84" height="56" viewBox="0 0 84 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Liquid glass body: crystal clear refractive depth, no top spotlight -->
    <linearGradient id="glassBody" x1="42" y1="2" x2="42" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="70%" stop-color="#0a0e17" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="0.38"/>
    </linearGradient>

    <!-- Outer rim stroke: delicate uniform glass edge -->
    <linearGradient id="edgeStroke" x1="42" y1="2" x2="42" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Inner rim highlight: delicate perimeter reflection -->
    <linearGradient id="innerRim" x1="42" y1="2" x2="42" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Left side optical refraction: stretches track 1-2px up and 1-2px down at the boundary -->
    <linearGradient id="leftRefractBlue" x1="3" y1="28" x2="15" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38a8ff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#0c8eff" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#0c8eff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0c8eff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="leftVerticalStretch" x1="5" y1="18" x2="5" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#70c4ff" stop-opacity="0.0"/>
      <stop offset="15%" stop-color="#38a8ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0c8eff" stop-opacity="0.98"/>
      <stop offset="85%" stop-color="#38a8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#70c4ff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Right side optical refraction: stretches track 1-2px up and 1-2px down at the boundary -->
    <linearGradient id="rightVerticalStretch" x1="79" y1="18" x2="79" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="15%" stop-color="#d0d8e8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#788090" stop-opacity="0.80"/>
      <stop offset="85%" stop-color="#d0d8e8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Side lens caustics: meniscus light arcs along curved semicircles -->
    <linearGradient id="causticLeft" x1="4" y1="14" x2="10" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="35%" stop-color="#55b5ff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#75c8ff" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#55b5ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="causticRight" x1="80" y1="14" x2="74" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="50%" stop-color="#c8d2e2" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- 1. Soft depth shadow -->
  <rect x="2" y="3" width="80" height="50" rx="25" fill="#000000" fill-opacity="0.25"/>

  <!-- 2. Glass body (clean, NO spotlight on top!) -->
  <rect x="2" y="2" width="80" height="52" rx="26" fill="url(#glassBody)"/>

  <!-- 3. Left Side Refraction: 2-3 pixels at boundary stretch vertically by 1-2px up and 1-2px down (y=18 to y=38) -->
  <path d="M 3 28 C 3 22, 4 18, 6 18 C 8 18, 11 22, 14 22 L 14 34 C 11 34, 8 38, 6 38 C 4 38, 3 34, 3 28 Z" fill="url(#leftVerticalStretch)"/>
  <path d="M 3 28 C 3 22, 4 19, 6 19 C 8 19, 10 22, 13 22 L 13 34 C 10 34, 8 37, 6 37 C 4 37, 3 34, 3 28 Z" fill="url(#leftRefractBlue)"/>

  <!-- 4. Right Side Refraction: stretches track vertically by 1-2px up and 1-2px down (y=18 to y=38) -->
  <path d="M 81 28 C 81 22, 80 18, 78 18 C 76 18, 73 22, 70 22 L 70 34 C 73 34, 76 38, 78 38 C 80 38, 81 34, 81 28 Z" fill="url(#rightVerticalStretch)"/>

  <!-- 5. Optical Lens Caustic Arcs at Left and Right curved glass semicircles -->
  <path d="M 12 14 C 6 18, 4 24, 4 28 C 4 32, 6 38, 12 42" stroke="url(#causticLeft)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 72 14 C 78 18, 80 24, 80 28 C 80 32, 78 38, 72 42" stroke="url(#causticRight)" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- 6. Inner rim reflection -->
  <rect x="3" y="3" width="78" height="50" rx="25" stroke="url(#innerRim)" stroke-width="1.2" fill="none"/>

  <!-- 7. Outer rim stroke -->
  <rect x="2" y="2" width="80" height="52" rx="26" stroke="url(#edgeStroke)" stroke-width="1.2" fill="none"/>
</svg>