<svg width="56" height="84" viewBox="0 0 56 84" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="glassBodyV" x1="28" y1="2" x2="28" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="65%" stop-color="#0a0e17" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="0.50"/>
    </linearGradient>
    <radialGradient id="topGlareV" cx="28" cy="12" r="24" fx="28" fy="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeStrokeV" x1="28" y1="1" x2="28" y2="83" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.40"/>
    </linearGradient>
    <linearGradient id="innerRimV" x1="28" y1="2" x2="28" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.80"/>
      <stop offset="20%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.40"/>
    </linearGradient>
  </defs>
  <!-- Glass body -->
  <rect x="2" y="2" width="52" height="80" rx="26" fill="url(#glassBodyV)"/>
  <!-- Specular top glare -->
  <ellipse cx="28" cy="14" rx="22" ry="9" fill="url(#topGlareV)"/>
  <!-- Inner rim highlight -->
  <rect x="3" y="3" width="50" height="78" rx="25" stroke="url(#innerRimV)" stroke-width="1.5" fill="none"/>
  <!-- Outer rim stroke -->
  <rect x="2" y="2" width="52" height="80" rx="26" stroke="url(#edgeStrokeV)" stroke-width="1.2" fill="none"/>
</svg>