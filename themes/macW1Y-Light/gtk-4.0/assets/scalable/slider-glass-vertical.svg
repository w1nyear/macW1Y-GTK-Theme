<svg width="56" height="84" viewBox="0 0 56 84" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Liquid glass body: crystal clear refractive depth, no top spotlight -->
    <linearGradient id="glassBodyV" x1="28" y1="2" x2="28" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="70%" stop-color="#0a0e17" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#050810" stop-opacity="0.38"/>
    </linearGradient>

    <!-- Outer rim stroke -->
    <linearGradient id="edgeStrokeV" x1="28" y1="2" x2="28" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Inner rim highlight -->
    <linearGradient id="innerRimV" x1="28" y1="2" x2="28" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="75%" stop-color="#000000" stop-opacity="0.0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Top optical refraction: stretches vertical track 1-2px left and 1-2px right at the boundary -->
    <linearGradient id="topRefractBlue" x1="28" y1="3" x2="28" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38a8ff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#0c8eff" stop-opacity="0.85"/>
      <stop offset="75%" stop-color="#0c8eff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0c8eff" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="topHorizontalStretch" x1="18" y1="5" x2="38" y2="5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#70c4ff" stop-opacity="0.0"/>
      <stop offset="15%" stop-color="#38a8ff" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0c8eff" stop-opacity="0.98"/>
      <stop offset="85%" stop-color="#38a8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#70c4ff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Bottom optical refraction: stretches vertical track 1-2px left and 1-2px right at the boundary -->
    <linearGradient id="bottomHorizontalStretch" x1="18" y1="79" x2="38" y2="79" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.0"/>
      <stop offset="15%" stop-color="#d0d8e8" stop-opacity="0.65"/>
      <stop offset="50%" stop-color="#788090" stop-opacity="0.80"/>
      <stop offset="85%" stop-color="#d0d8e8" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Optical lens caustics at top and bottom semicircles -->
    <linearGradient id="causticTop" x1="14" y1="4" x2="42" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="35%" stop-color="#55b5ff" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#75c8ff" stop-opacity="0.85"/>
      <stop offset="65%" stop-color="#55b5ff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>

    <linearGradient id="causticBottom" x1="14" y1="80" x2="42" y2="74" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.40"/>
      <stop offset="50%" stop-color="#c8d2e2" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- 1. Soft depth shadow -->
  <rect x="3" y="2" width="50" height="80" rx="25" fill="#000000" fill-opacity="0.25"/>

  <!-- 2. Glass body (clean, NO spotlight!) -->
  <rect x="2" y="2" width="52" height="80" rx="26" fill="url(#glassBodyV)"/>

  <!-- 3. Top Refraction: 2-3 pixels at boundary stretch horizontally by 1-2px left and 1-2px right (x=18 to x=38) -->
  <path d="M 28 3 C 22 3, 18 4, 18 6 C 18 8, 22 11, 22 14 L 34 14 C 34 11, 38 8, 38 6 C 38 4, 34 3, 28 3 Z" fill="url(#topHorizontalStretch)"/>
  <path d="M 28 3 C 22 3, 19 4, 19 6 C 19 8, 22 10, 22 13 L 34 13 C 34 10, 37 8, 37 6 C 37 4, 34 3, 28 3 Z" fill="url(#topRefractBlue)"/>

  <!-- 4. Bottom Refraction: stretches vertical track horizontally by 1-2px left and right (x=18 to x=38) -->
  <path d="M 28 81 C 22 81, 18 80, 18 78 C 18 76, 22 73, 22 70 L 34 70 C 34 73, 38 76, 38 78 C 38 80, 34 81, 28 81 Z" fill="url(#bottomHorizontalStretch)"/>

  <!-- 5. Optical Lens Caustic Arcs at Top and Bottom curved glass semicircles -->
  <path d="M 14 12 C 18 6, 24 4, 28 4 C 32 4, 38 6, 42 12" stroke="url(#causticTop)" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 14 72 C 18 78, 24 80, 28 80 C 32 80, 38 78, 42 72" stroke="url(#causticBottom)" stroke-width="1.6" stroke-linecap="round" fill="none"/>

  <!-- 6. Inner rim reflection -->
  <rect x="3" y="3" width="50" height="78" rx="25" stroke="url(#innerRimV)" stroke-width="1.2" fill="none"/>

  <!-- 7. Outer rim stroke -->
  <rect x="2" y="2" width="52" height="80" rx="26" stroke="url(#edgeStrokeV)" stroke-width="1.2" fill="none"/>
</svg>